<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9 - Font Awesome</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            margin: 30px;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .icon-item {
            display: inline-block;
            width: 120px;
            margin: 20px 10px;
            vertical-align: top;
        }

        .icon-item p {
            margin: 12px 0 0;
        }
    </style>
</head>
<body>
    <div class="icon-item">
        <i class="fas fa-store fa-3x"
           style="color: #007bff;"></i>
        <p>Cửa hàng</p>
    </div>

    <div class="icon-item">
        <i class="fas fa-shopping-cart fa-3x"
           style="color: #28a745;"></i>
        <p>Giỏ hàng</p>
    </div>

    <div class="icon-item">
        <i class="fas fa-credit-card fa-3x"
           style="color: #6f42c1;"></i>
        <p>Thanh toán</p>
    </div>

    <div class="icon-item">
        <i class="fas fa-truck fa-3x"
           style="color: #fd7e14;"></i>
        <p>Giao hàng</p>
    </div>

    <div class="icon-item">
        <i class="fas fa-headset fa-3x"
           style="color: #dc3545;"></i>
        <p>Hỗ trợ</p>
    </div>
</body>
</html>
