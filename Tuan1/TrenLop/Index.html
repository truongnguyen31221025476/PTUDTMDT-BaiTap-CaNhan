<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cửa hàng của tôi</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
header { background: #23744b; color: white; padding: 20px; text-align: center; }
main { max-width: 900px; margin: auto; padding: 20px; }
.products { display: flex; flex-wrap: wrap; gap: 16px; }
.product { flex: 1 1 200px; background: white; padding: 20px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
.icon { font-size: 60px; }
button { background: #23744b; color: white; border: none; border-radius: 4px; padding: 10px 16px; cursor: pointer; }
button:hover { background: #185536; }
button:focus-visible { outline: 3px solid #e5ac28; outline-offset: 3px; }
.cart { background: white; padding: 20px; margin-top: 24px; border-radius: 8px; }
footer { text-align: center; padding: 20px; color: #555; }
</style>
</head>
<body>
<header>
    <h1>Cửa hàng của tôi</h1>
    <p>Sản phẩm đơn giản, giá cả hợp lý</p>
</header>
<main>
    <h2>Sản phẩm</h2>
    <div class="products">
        <article class="product">
            <div class="icon" aria-hidden="true">👕</div>
            <h3>Áo thun</h3>
            <p>100.000 ₫</p>
            <button type="button" onclick="addToCart('Áo thun', 100000)">Thêm vào giỏ</button>
        </article>
        <article class="product">
            <div class="icon" aria-hidden="true">👜</div>
            <h3>Túi vải</h3>
            <p>80.000 ₫</p>
            <button type="button" onclick="addToCart('Túi vải', 80000)">Thêm vào giỏ</button>
        </article>
        <article class="product">
            <div class="icon" aria-hidden="true">🧢</div>
            <h3>Mũ lưỡi trai</h3>
            <p>60.000 ₫</p>
            <button type="button" onclick="addToCart('Mũ lưỡi trai', 60000)">Thêm vào giỏ</button>
        </article>
    </div>
    <section class="cart" aria-labelledby="cart-title">
        <h2 id="cart-title">Giỏ hàng</h2>
        <div aria-live="polite">
            <p id="empty-cart">Giỏ hàng chưa có sản phẩm.</p>
            <ul id="cart-items"></ul>
            <p><strong>Tổng tiền: <span id="total">0 ₫</span></strong></p>
        </div>
        <button type="button" onclick="clearCart()">Xóa giỏ hàng</button>
    </section>
</main>
<footer>Liên hệ: shop@example.com · Trang bán hàng mẫu</footer>
<script>
let total = 0;
const money = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' });

function addToCart(name, price) {
    const item = document.createElement('li');
    item.textContent = name + ' — ' + money.format(price);
    document.getElementById('cart-items').appendChild(item);
    total += price;
    document.getElementById('total').textContent = money.format(total);
    document.getElementById('empty-cart').hidden = true;
}

function clearCart() {
    document.getElementById('cart-items').replaceChildren();
    total = 0;
    document.getElementById('total').textContent = money.format(total);
    document.getElementById('empty-cart').hidden = false;
}
</script>
</body>
</html>
